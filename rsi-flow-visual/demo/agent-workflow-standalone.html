<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 协作测试</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#233437;background:#f3f6f5;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}header{background:#fff;border-bottom:1px solid #dce5e3;padding:18px clamp(16px,3vw,40px);display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 14px}h3{font-size:14px;margin:0 0 9px}.badge{color:#176b5c;background:#e8f4ef;border:1px solid #b5dbcf;padding:3px 8px;border-radius:4px}.layout{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);min-height:calc(100vh - 71px)}.settings{padding:22px;background:white;border-right:1px solid #dce5e3}.stage{padding:22px clamp(16px,3vw,40px)}.field{display:block;margin:0 0 12px;font-size:12px;font-weight:600;color:#50646a}.field>input,.field>textarea,.field>select{margin-top:5px;display:block;width:100%;padding:8px 10px;border:1px solid #cbd8d7;border-radius:4px;background:#fff;color:#223539;outline-color:#278572;min-width:0}.field textarea{min-height:76px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.wide{grid-column:1/-1}.group{border-top:1px solid #e1e8e7;margin-top:18px;padding-top:18px}.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.group-head h2{margin:0}.worker{border:1px solid #dae4e2;border-radius:5px;padding:12px;margin-bottom:12px;background:#fbfdfc}.worker-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:1px solid #bacdca;border-radius:4px;background:#fff;color:#25453f;padding:7px 12px;cursor:pointer}button:hover{border-color:#23816d}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#167a68;color:white;border-color:#167a68}.danger{color:#a33b3b}.status{min-height:22px;color:#5b7176}.error{color:#a73838}.ok{color:#176b5c}.topology{display:flex;flex-direction:column;align-items:center;gap:10px;background:#eaf0ee;border:1px solid #d7e1df;padding:26px 16px;min-height:225px}.node{max-width:100%;min-width:155px;background:white;border:1px solid #b8d5cb;border-left:4px solid #207d68;border-radius:5px;padding:10px 14px;text-align:center;overflow-wrap:anywhere}.node small{display:block;color:#63767b}.workers-view{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}.workers-view .node{border-left-color:#468ba2}.arrow{color:#52746e}.output{margin-top:22px}.review{padding:10px 12px;border-left:3px solid #23816d;background:#eef7f2;margin:10px 0;overflow-wrap:anywhere}.task{border:1px solid #dbe5e3;border-radius:5px;padding:12px;margin:10px 0;background:white}.task p,.review p{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.muted{color:#718489}body.busy button{cursor:wait}@media(max-width:800px){.layout{display:block}.settings{border-right:0;border-bottom:1px solid #dce5e3}.stage{padding-bottom:40px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Agent 协作测试</h1><span class="badge">独立 HTML</span></header>
<main class="layout">
<section class="settings" aria-label="配置">
<h2>运行配置</h2>
<label class="field">任务目标<textarea id="objective" maxlength="4000" placeholder="输入要完成的任务">整理产品需求并检查潜在风险</textarea></label>
<div class="grid"><label class="field">最大返工次数<select id="revisions"><option>0</option><option selected>1</option><option>2</option></select></label><label class="field">后端地址<input id="backend" value="http://localhost:39910" autocomplete="url"></label></div>
<div class="group"><div class="group-head"><h2>Supervisor</h2></div><div id="supervisor"></div></div>
<div class="group"><div class="group-head"><h2>工作 Agent <span id="count" class="muted"></span></h2><button id="add" type="button" title="添加工作 Agent">＋ 添加</button></div><div id="workers"></div></div>
<div class="actions"><button id="simulate" type="button" class="primary">本地模拟</button><button id="connect" type="button">连接后端</button></div>
</section>
<section class="stage" aria-label="流程与结果"><h2>协作拓扑</h2><div id="topology" class="topology"></div><div class="output"><h2>运行结果</h2><p id="status" class="status muted">尚未运行</p><div id="result"></div></div></section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const agents=[{id:'supervisor',role:'审核并汇总工作结果',model:'',apiUrl:'',apiKey:''},{id:'worker-1',role:'分析任务',model:'',apiUrl:'',apiKey:''}];
let busy=false;
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=String(text);return e}
function field(agent,name,label,type){const wrap=el('label','field',label),input=el('input');input.type=type||'text';input.value=agent[name];input.autocomplete='off';if(name==='apiUrl')input.placeholder='https://.../v1/chat/completions';if(name==='model')input.placeholder='模型标识';input.addEventListener('input',()=>{agent[name]=input.value;if(name==='id'||name==='model')topology()});wrap.append(input);return wrap}
function editor(agent){const grid=el('div','grid');[['id','标识'],['model','模型'],['role','职责'],['apiUrl','API 地址'],['apiKey','API 密钥']].forEach(([key,label])=>{const item=field(agent,key,label,key==='apiKey'?'password':'text');if(key==='role'||key==='apiUrl'||key==='apiKey')item.classList.add('wide');grid.append(item)});return grid}
function render(){const supervisor=$('supervisor'),workers=$('workers');supervisor.replaceChildren(editor(agents[0]));workers.replaceChildren();agents.slice(1).forEach((agent,index)=>{const card=el('div','worker'),head=el('div','worker-head'),name=el('strong','',`Agent ${index+1}`),remove=el('button','danger','移除');remove.type='button';remove.disabled=agents.length===2;remove.addEventListener('click',()=>{agents.splice(index+1,1);render()});head.append(name,remove);card.append(head,editor(agent));workers.append(card)});$('count').textContent=`${agents.length-1} / 12`;$('add').disabled=agents.length>=13;topology()}
function topology(){const box=$('topology'),sup=el('div','node',agents[0].model||agents[0].id),small=el('small','','Supervisor');sup.append(small);const arrow=el('div','arrow','↓ 分派 · 审核 / 返工'),row=el('div','workers-view');agents.slice(1).forEach(agent=>{const item=el('div','node',agent.model||agent.id),info=el('small','',agent.id);item.append(info);row.append(item)});box.replaceChildren(sup,arrow,row)}
function status(message,kind){$('status').className='status '+(kind||'muted');$('status').textContent=message}
function validate(real){const objective=$('objective').value.trim();if(!objective)throw Error('请输入任务目标');if(agents.some(a=>!a.id.trim()||!a.role.trim()))throw Error('请填写每个 Agent 的标识和职责');if(new Set(agents.map(a=>a.id.trim())).size!==agents.length)throw Error('Agent 标识不能重复');if(real&&agents.some(a=>!a.model.trim()||!a.apiUrl.trim()||!a.apiKey.trim()))throw Error('真实调用需要填写每个 Agent 的模型、API 地址和密钥');return {objective,maxRevisions:Number($('revisions').value),supervisor:{...agents[0]},workers:agents.slice(1).map(a=>({...a}))}}
function show(payload,mode){const box=$('result');box.replaceChildren();const review=el('div','review');review.append(el('strong','',`${payload.approved?'审核通过':'未通过'} · 返工 ${payload.revisions} 次`));if(payload.feedback)review.append(el('p','',`审核意见：${payload.feedback}`));box.append(review);if(payload.answer){const answer=el('div','task');answer.append(el('strong','','最终答复'),el('p','',payload.answer));box.append(answer)}(payload.results||[]).forEach(item=>{const card=el('div','task');card.append(el('strong','',`${item.workerId} · 第 ${item.attempt} 次执行`),el('p','muted',item.instruction),el('p','',item.output));box.append(card)});status(mode==='sim'?'本地模拟结果（未调用后端或 AI）':'后端返回结果','ok')}
function simulate(){try{const config=validate(false),rounds=Math.min(config.maxRevisions,1),results=config.workers.map((worker,index)=>({id:`task-${index+1}`,workerId:worker.id,instruction:`${worker.role}：${config.objective}`,output:`模拟输出：${worker.id} 已处理任务${rounds&&index===0?'，并依据审核意见修订':''}。`,attempt:rounds&&index===0?2:1}));show({approved:true,answer:`模拟汇总：${config.objective}`,feedback:rounds?'模拟审核：第一位 Agent 需返工，修订后通过。':'模拟审核：本轮通过。',revisions:rounds,results},'sim')}catch(error){status(error.message,'error')}}
async function connect(){if(busy)return;let config,url;try{config=validate(true);const base=new URL($('backend').value);if(!['http:','https:'].includes(base.protocol)||base.username||base.password||base.search||base.hash)throw Error('后端地址必须是 HTTP(S) 服务根地址');url=new URL('/api/agent/workflow',base)}catch(error){status(error.message,'error');return}busy=true;document.body.classList.add('busy');$('connect').disabled=true;$('result').replaceChildren();status('正在连接后端...');try{const response=await fetch(url.href,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});if(!response.ok){const text=await response.text();throw Error(`HTTP ${response.status}: ${text.slice(0,300)||response.statusText}`)}show(await response.json(),'real')}catch(error){status(`连接失败：${error.message}。请确认后端已启动、允许此页面来源跨域，并且 API 配置有效。`,'error')}finally{busy=false;document.body.classList.remove('busy');$('connect').disabled=false}}
$('add').addEventListener('click',()=>{if(agents.length<13){agents.push({id:`worker-${Date.now()}`,role:'',model:'',apiUrl:'',apiKey:''});render()}});$('simulate').addEventListener('click',simulate);$('connect').addEventListener('click',connect);render();
})();
</script>
</body>
</html>
